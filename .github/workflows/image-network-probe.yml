name: Test archive recovery network
on:
  push:
    branches: [codex/local-archive-images]
    paths: ['.github/workflows/image-network-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests
      - run: python scripts/recover_images.py --limit 3 --originals --resume docs/image-recovery-report.json --output recovery-downloads
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-network-probe
          path: recovery-downloads
          retention-days: 7
