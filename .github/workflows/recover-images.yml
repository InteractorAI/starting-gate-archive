name: Recover archived images
on:
  push:
    branches: [codex/local-archive-images]
    paths: ['scripts/recover_images.py', '.github/workflows/recover-images.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/recover_images.py --limit 1 --output recovery-downloads
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-images
          path: recovery-downloads
          retention-days: 7
